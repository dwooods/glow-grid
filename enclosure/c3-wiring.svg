<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1212" font-family="Helvetica, Arial, sans-serif">
<rect width="1240" height="1212" fill="#fff"/>
<text x="30" y="40" font-size="24" font-weight="700" fill="#111">Glow Grid wiring: power, data, buttons (C3 build)</text>
<text x="30" y="64" font-size="14" fill="#444">Thick = panel current (up to ~4.7 A at brightness 0.3). Thin = C3 branch (well under 0.3 A).</text>
<text x="30" y="84" font-size="14" fill="#444">Pin map checked against the SuperMini pinout (2026-10-14). Bench-tested: USB flashing, Wi-Fi, both buttons, onboard RGB LED (GPIO8, unused here), 16x16 panel from GPIO6 (c3_panel_test.ino).</text>
<text x="30" y="104" font-size="14" fill="#444">Frame v7 puts the jack just above the C3 holder and the two buttons in a row beside it; the pin-tip wires leave through the gap in the left wall's lip.</text>
<text x="30" y="122" font-size="12" fill="#666">The C3 has 2 RMT TX channels: one for the panel, the onboard LED only if one is left.</text>

<g transform="translate(0,22)"><!-- supply -->
<rect x="30" y="130" width="170" height="130" rx="8" fill="#eef2f7" stroke="#333" stroke-width="2"/>
<text x="115" y="165" font-size="17" font-weight="700" text-anchor="middle">5V 6A supply</text>
<text x="115" y="188" font-size="13" text-anchor="middle" fill="#444">barrel plug, 5.5 x 2.5 mm</text>
<text x="115" y="210" font-size="13" text-anchor="middle" fill="#444">centre = +5V, sleeve = GND</text>
<text x="115" y="232" font-size="13" text-anchor="middle" fill="#444">(check polarity on yours)</text>

<!-- jack on frame back -->
<rect x="270" y="130" width="190" height="130" rx="8" fill="#fff6e0" stroke="#333" stroke-width="2"/>
<text x="365" y="156" font-size="14" font-weight="700" text-anchor="middle">Panel-mount DC jack</text>
<text x="365" y="174" font-size="12" text-anchor="middle" fill="#444">in the frame back (5 A rated)</text>
<circle cx="460" cy="205" r="7" fill="#d62d20"/><text x="395" y="209" font-size="14" font-weight="700">+5V</text>
<circle cx="460" cy="240" r="7" fill="#111"/><text x="395" y="244" font-size="14" font-weight="700">GND</text>
<path d="M200 205 H270" stroke="#d62d20" stroke-width="6"/><path d="M200 240 H270" stroke="#111" stroke-width="6"/>

<!-- panel -->
<rect x="880" y="130" width="330" height="190" rx="8" fill="#eaf6ea" stroke="#333" stroke-width="2"/>
<text x="1045" y="158" font-size="17" font-weight="700" text-anchor="middle">16 x 16 LED panel</text>
<text x="1045" y="178" font-size="12" text-anchor="middle" fill="#444">its three leads: 5V, GND, DIN (at the DIN end)</text>
<circle cx="880" cy="205" r="7" fill="#d62d20"/><text x="1118" y="209" font-size="14" font-weight="700" text-anchor="end">5V lead</text>
<circle cx="880" cy="240" r="7" fill="#111"/><text x="1118" y="244" font-size="14" font-weight="700" text-anchor="end">GND lead</text>
<circle cx="880" cy="290" r="7" fill="#2a6fd6"/><text x="1118" y="294" font-size="14" font-weight="700" text-anchor="end">DIN (data in)</text>

<!-- heavy wires -->
<path d="M460 205 H880" stroke="#d62d20" stroke-width="8"/><path d="M460 240 H880" stroke="#111" stroke-width="8"/>
<text x="660" y="196" font-size="14" font-weight="700" fill="#d62d20" text-anchor="middle">+5V  heavy wire, 18 AWG or thicker, short</text>
<text x="660" y="262" font-size="14" font-weight="700" fill="#111" text-anchor="middle">GND  heavy wire, same gauge</text>
<text x="660" y="282" font-size="13" fill="#b00" text-anchor="middle">all LED current runs on these two wires only</text>

<!-- C3 -->
<rect x="470" y="420" width="190" height="270" rx="10" fill="#14181f" stroke="#000" stroke-width="2"/>
<rect x="520" y="404" width="90" height="26" rx="4" fill="#bbb" stroke="#555"/><text x="565" y="422" font-size="12" text-anchor="middle" fill="#222">USB-C</text>
<text x="565" y="570" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">ESP32-C3</text>
<text x="565" y="590" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">SuperMini</text>
<text x="565" y="613" font-size="12" text-anchor="middle" fill="#9ab">24 x 18 mm, USB-C up</text>
<g font-size="13" fill="#fff" font-weight="700">
<circle cx="470" cy="460" r="6" fill="#d62d20"/><text x="482" y="465">5V</text>
<circle cx="470" cy="495" r="6" fill="#999"/><text x="482" y="500">G</text>
<circle cx="470" cy="530" r="6" fill="#e0a020"/><text x="482" y="535">3.3</text>
<circle cx="470" cy="565" r="6" fill="#4a8"/><text x="482" y="570">4</text>
<circle cx="470" cy="600" r="6" fill="#4a8"/><text x="482" y="605">3</text>
<circle cx="660" cy="460" r="6" fill="#4a8"/><text x="648" y="465" text-anchor="end">5</text>
<circle cx="660" cy="495" r="6" fill="#4a8"/><text x="648" y="500" text-anchor="end">6</text>
<circle cx="660" cy="530" r="6" fill="#4a8"/><text x="648" y="535" text-anchor="end">7</text>
</g>

<!-- C3 power branch (thin) from the jack terminals -->
<path d="M475 205 V300 H420 V460 H470" fill="none" stroke="#d62d20" stroke-width="2.5"/>
<path d="M490 240 V320 H395 V495 H470" fill="none" stroke="#111" stroke-width="2.5"/>
<circle cx="475" cy="205" r="4" fill="#d62d20"/><circle cx="490" cy="240" r="4" fill="#111"/>
<text x="30" y="455" font-size="14" font-weight="700" fill="#d62d20">C3 power branch, thin (22 AWG):</text>
<text x="30" y="475" font-size="13" fill="#333">+5V to the C3 5V pin, GND to the C3 G pin.</text>
<text x="30" y="495" font-size="13" fill="#333">Joined at the jack, so supply, panel and C3</text>
<text x="30" y="515" font-size="13" fill="#333">share one ground. The C3 draws roughly</text>
<text x="30" y="535" font-size="13" fill="#333">0.1 to 0.2 A (Wi-Fi bursts higher).</text>

<!-- diode -->
<polygon points="410,338 430,338 420,358" fill="#fff" stroke="#d62d20" stroke-width="2.5"/>
<line x1="408" y1="358" x2="432" y2="358" stroke="#d62d20" stroke-width="3"/>
<text x="440" y="346" font-size="12" font-weight="700" fill="#d62d20">Schottky diode (1N5819)</text>
<text x="440" y="362" font-size="12" fill="#333">bar toward the C3; stops supply and USB fighting</text>
<!-- data -->
<path d="M660 495 H800 V290 H880" fill="none" stroke="#2a6fd6" stroke-width="3"/>
<text x="810" y="400" font-size="14" font-weight="700" fill="#2a6fd6">Data: GPIO6 to panel DIN</text>
<text x="810" y="420" font-size="13" fill="#333">short wire; if pixels flicker, add a</text>
<text x="810" y="438" font-size="13" fill="#333">74AHCT125 level shifter (3.3 V to 5 V)</text>

<!-- buttons -->
<rect x="760" y="560" width="70" height="30" rx="6" fill="#fff" stroke="#333" stroke-width="2"/><text x="795" y="580" font-size="13" text-anchor="middle">Next</text>
<rect x="760" y="620" width="70" height="30" rx="6" fill="#fff" stroke="#333" stroke-width="2"/><text x="795" y="640" font-size="13" text-anchor="middle">On/off</text>
<path d="M660 460 H720 V575 H760" fill="none" stroke="#4a8" stroke-width="2.5"/>
<path d="M660 530 H700 V635 H760" fill="none" stroke="#4a8" stroke-width="2.5"/>
<path d="M830 575 H860 V705 H395" fill="none" stroke="#111" stroke-width="2.5"/>
<path d="M830 635 H860" fill="none" stroke="#111" stroke-width="2.5"/>
<path d="M395 495 V705" stroke="#111" stroke-width="2.5"/><circle cx="395" cy="705" r="4" fill="#111"/>
<text x="880" y="560" font-size="14" font-weight="700" fill="#333">Two push buttons (back plate)</text>
<text x="880" y="580" font-size="13" fill="#333">Each joins a GPIO to GND when pressed</text>
<text x="880" y="600" font-size="13" fill="#333">(internal pull-ups in firmware).</text>
<text x="880" y="620" font-size="13" fill="#333">Next image: GPIO5.  On/off: GPIO7.</text>
<text x="880" y="640" font-size="13" fill="#333">Wire the buttons' GND leg to the same ground.</text>
<!-- notes -->
<rect x="30" y="728" width="1180" height="64" rx="6" fill="#fdecea" stroke="#d62d20"/>
<text x="46" y="752" font-size="14" fill="#7a0e06"><tspan font-weight="700">Never</tspan> run the panel's current through the C3's 5V pin. USB is for flashing from a computer only; the C3's power comes from the supply branch.</text>
<text x="46" y="774" font-size="14" fill="#7a0e06">Flash over the frame's USB-C slot as normal. The C3's BOOT and RST buttons face the panel and are not reachable once assembled, so keep them for recovery on the bench.</text>

<!-- table -->
<text x="30" y="826" font-size="18" font-weight="700" fill="#111">Build checklist (tick as you go)</text>
<g font-size="13" fill="#222">
<rect x="30" y="838" width="1180" height="26" fill="#e8ecf1"/>
<text x="46" y="856" font-weight="700">#</text><text x="90" y="856" font-weight="700">From</text><text x="400" y="856" font-weight="700">To</text><text x="760" y="856" font-weight="700">Wire / part</text><text x="1160" y="856" font-weight="700">Done</text>
<rect x="30" y="864" width="1180" height="26" fill="#fff"/><text x="46" y="882">1</text><text x="90" y="882">Flash the C3 over USB (bench, nothing else wired)</text><text x="400" y="882">BOOT + RST only if it will not appear on the computer</text><text x="760" y="882">USB-C cable</text><rect x="1160" y="870" width="14" height="14" fill="#fff" stroke="#333"/>
<rect x="30" y="890" width="1180" height="26" fill="#f6f8fa"/><text x="46" y="908">2</text><text x="90" y="908">Supply barrel plug</text><text x="400" y="908">5.5x2.5 mm panel jack (10.8 mm hole, 5 A)</text><text x="760" y="908">red = +, black = GND; check polarity</text><rect x="1160" y="896" width="14" height="14" fill="#fff" stroke="#333"/>
<rect x="30" y="916" width="1180" height="26" fill="#fff"/><text x="46" y="934">3</text><text x="90" y="934">Jack +5V</text><text x="400" y="934">Panel 5V lead</text><text x="760" y="934">18 AWG or thicker, short, red</text><rect x="1160" y="922" width="14" height="14" fill="#fff" stroke="#333"/>
<rect x="30" y="942" width="1180" height="26" fill="#f6f8fa"/><text x="46" y="960">4</text><text x="90" y="960">Jack GND</text><text x="400" y="960">Panel GND lead</text><text x="760" y="960">18 AWG or thicker, short, black</text><rect x="1160" y="948" width="14" height="14" fill="#fff" stroke="#333"/>
<rect x="30" y="968" width="1180" height="26" fill="#fff"/><text x="46" y="986">5</text><text x="90" y="986">Jack +5V  via diode</text><text x="400" y="986">C3 5V pin</text><text x="760" y="986">22 AWG; diode (bar toward C3)</text><rect x="1160" y="974" width="14" height="14" fill="#fff" stroke="#333"/>
<rect x="30" y="994" width="1180" height="26" fill="#f6f8fa"/><text x="46" y="1012">6</text><text x="90" y="1012">Jack GND</text><text x="400" y="1012">C3 G pin</text><text x="760" y="1012">22 AWG, black</text><rect x="1160" y="1000" width="14" height="14" fill="#fff" stroke="#333"/>
<rect x="30" y="1020" width="1180" height="26" fill="#fff"/><text x="46" y="1038">7</text><text x="90" y="1038">C3 GPIO6</text><text x="400" y="1038">Panel DIN</text><text x="760" y="1038">22-26 AWG, short; 74AHCT125 only if flicker</text><rect x="1160" y="1026" width="14" height="14" fill="#fff" stroke="#333"/>
<rect x="30" y="1046" width="1180" height="26" fill="#f6f8fa"/><text x="46" y="1064">8</text><text x="90" y="1064">Button Next: GPIO5</text><text x="400" y="1064">GND (same ground)</text><text x="760" y="1064">2 wires to a 12 mm panel button</text><rect x="1160" y="1052" width="14" height="14" fill="#fff" stroke="#333"/>
<rect x="30" y="1072" width="1180" height="26" fill="#fff"/><text x="46" y="1090">9</text><text x="90" y="1090">Button On/off: GPIO7</text><text x="400" y="1090">GND (same ground)</text><text x="760" y="1090">2 wires to a 12 mm panel button</text><rect x="1160" y="1078" width="14" height="14" fill="#fff" stroke="#333"/>
<rect x="30" y="1098" width="1180" height="26" fill="#f6f8fa"/><text x="46" y="1116">10</text><text x="90" y="1116">Meter check before power</text><text x="400" y="1116">5V to GND is not a short</text><text x="760" y="1116">multimeter, supply unplugged</text><rect x="1160" y="1104" width="14" height="14" fill="#fff" stroke="#333"/>
<rect x="30" y="1124" width="1180" height="26" fill="#fff"/><text x="46" y="1142">11</text><text x="90" y="1142">First power-up</text><text x="400" y="1142">Brightness low, one frame, watch for heat</text><text x="760" y="1142">supply on, panel at low brightness</text><rect x="1160" y="1130" width="14" height="14" fill="#fff" stroke="#333"/>
</g>
</g>
</svg>
