# Deploys web/ to GitHub Pages (https://thewoodshed.dev/glow-grid/).
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# Two jobs, as in GitHub's own Pages template: build uploads the site, deploy (a separate job) publishes it. The
# artifact lookup in deploy then never races the upload, and a failed deploy can be re-run without rebuilding.
name: Deploy simulator to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'examples/sprites.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 web/make_icons.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
